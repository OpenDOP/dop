name: Bug report
description: Something behaves differently from what is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        DOP has no release yet, so a bug here is a defect in `main`.

        Not sure it is a bug? Ask in
        [Discussions](https://github.com/OpenDOP/dop/discussions) instead.

        **Never report a security vulnerability here.** Use
        [private reporting](https://github.com/OpenDOP/dop/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA you are on, or the image tag once releases exist.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - contracts
        - core
        - analytics
        - web
        - infrastructure
        - examples
        - scripts
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPU architecture (amd64 or arm64), Docker version, available RAM.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant output. It is rendered as code, so no backticks are needed.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: This report contains no secrets, credentials, real telemetry or personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
