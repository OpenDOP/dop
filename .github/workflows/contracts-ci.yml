name: Contracts CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
          overwrite-settings: false

      - name: Set up Buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: '1.73.0'
          setup_only: true
          pr_comment: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Verify tool versions
        run: |
          java -version
          javac -version
          test "$(buf --version)" = '1.73.0'
          uv --version
          sh java/gradlew --no-daemon --console=plain -p java --version

      - name: Lint Protobuf contracts
        run: buf lint

      - name: Check Protobuf formatting
        run: buf format --diff --exit-code

      - name: Generate Java and Python contracts
        run: buf generate

      - name: Compile Java contracts and verify consumption
        run: sh java/gradlew --no-daemon --console=plain -p java check

      - name: Prepare locked Python environment
        working-directory: contracts/python
        run: |
          uv python install 3.12.15
          uv sync --frozen --python 3.12.15 --managed-python
          uv run --frozen --no-sync python --version

      - name: Verify Python consumption
        working-directory: contracts/python
        run: uv run --frozen --no-sync python -m unittest -v

      - name: Verify Java to Python golden files
        working-directory: contracts/python
        run: uv run --frozen --no-sync python run_interop.py --direction java-to-python

      - name: Verify Python to Java golden files
        working-directory: contracts/python
        run: uv run --frozen --no-sync python run_interop.py --direction python-to-java
